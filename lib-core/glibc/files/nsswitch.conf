# /etc/nsswitch.conf

passwd:     files
shadow:     files
group:      files
gshadow:    files

# Keep hostname lookup libc-neutral.  On resolved-enabled bootable systems
# /etc/resolv.conf points at the local resolved stub; musl follows the same
# /etc/hosts-then-DNS contract without reading this file.
hosts:      files dns

networks:   files

protocols:  files
services:   files
ethers:     files
rpc:        files
aliases:    files
netgroup:   files
